services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../..:/workspaces:cached
      - ../../.codex:/home/node/.codex
    command: sleep infinity
    networks:
      - devnet
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ../.env
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - devnet

  rabbitmq:
    image: rabbitmq:4.0-management
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "15672:15672"
    networks:
      - devnet
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  devnet:
