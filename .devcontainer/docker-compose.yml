services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    networks:
      - devnet
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 3s
      retries: 5
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - devnet

  rabbitmq:
    image: rabbitmq:4.0-management
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "15672:15672" # Management UI
    networks:
      - devnet
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql-data:
  rabbitmq_data:

networks:
  devnet:
